name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked ruff check contract mcp_server backend
      - run: uv run --locked ruff format --check contract mcp_server backend
      - run: uv run --locked mypy
      - run: uv run --locked python contract/scripts/export_schema.py --check
      - run: uv run --locked python mcp_server/scripts/export_tool_reference.py --check
      - run: uv run --locked pytest contract/tests mcp_server/tests backend/tests
