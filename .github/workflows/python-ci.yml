name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group postgres
      - run: uv run --locked ruff check contract mcp_server backend
      - run: uv run --locked ruff format --check contract mcp_server backend
      - run: uv run --locked --group postgres mypy
      - run: uv run --locked python contract/scripts/export_schema.py --check
      - run: uv run --locked python mcp_server/scripts/export_tool_reference.py --check
      - run: uv run --locked --group postgres pytest contract/tests mcp_server/tests backend/tests
        env:
          DOCTER_TEST_INDEX_POSTGRES_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
