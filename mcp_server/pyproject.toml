[project]
name = "docter-mcp"
version = "0.1.0"
description = "Docter MCP server: index a code repository and find, add, fix, and translate its docs."
requires-python = ">=3.12"
dependencies = [
    "docstring-parser>=0.18.0",
    "docter-contract",
    "fastembed>=0.7",
    "lancedb>=0.25",
    "mcp>=2.3.0",
    "pathspec>=0.12",
    "pydantic>=2.14.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
docter-mcp = "docter_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docter_mcp"]
