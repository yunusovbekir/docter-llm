# Virtual workspace root: it has no [project] of its own. `uv sync` installs every
# member (editable) through the dev dependency group below.
[tool.uv.workspace]
members = ["contract", "mcp_server", "backend"]

[tool.uv.sources]
docter-contract = { workspace = true }
docter-mcp = { workspace = true }
docter = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests", "contract/tests", "mcp_server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "contract/src", "mcp_server/src"]
# The sample repository is test data: it deliberately contains a syntax error and drifted docs.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "contract/src,mcp_server/src"
files = [
    "backend",
    "contract/src",
    "contract/scripts",
    "contract/tests",
    "mcp_server/src",
    "mcp_server/tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "docter-contract",
    "docter-mcp",
    "docter",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0",
]
