[project]
name = "docter-contract"
version = "0.1.0"
description = "Shared tool contract (pydantic models, error codes, resource URIs) for the Docter MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docter_contract"]
